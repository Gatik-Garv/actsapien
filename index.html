const today  = () => new Date().toDateString();
const clamp  = (v,mn,mx) => Math.min(mx,Math.max(mn,v));
const fmtKm  = v => v%1===0 ? String(v) : v.toFixed(1);

function useStorage(key,init) {
  const [val,setVal] = useState(()=>{
    try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch{return init;}
  });
  const set = v=>{setVal(v);try{localStorage.setItem(key,JSON.stringify(v));}catch{}};
  return [val,set];
}

function useDark() {
  const [dark,setDark] = useState(()=>
    typeof window!=="undefined"?window.matchMedia("(prefers-color-scheme:dark)").matches:false
  );
  useEffect(()=>{
    const mq=window.matchMedia("(prefers-color-scheme:dark)");
    const h=e=>setDark(e.matches);
    mq.addEventListener("change",h);
    return()=>mq.removeEventListener("change",h);
  },[]);
  return dark;
}

function calcAction(action,distKm,subtype,passengers) {
  if(!action.hasDistance) return {co2:action.co2,credits:action.credits};
  let cpm = action.co2PerKm;
  if(action.subtypes&&subtype){const st=action.subtypes.find(s=>s.id===subtype);if(st)cpm=st.co2PerKm;}
  if(action.hasPassengers&&passengers>1) cpm=CAR*(1-1/passengers);
  return {
    co2:     parseFloat((cpm*distKm).toFixed(3)),
    credits: Math.max(1,Math.round(action.creditsPerKm*distKm)),
  };
}

// ─── KWH MODAL (EV Charger) ───────────────────────────────────────────────────
// kWh → CO₂ saved vs equivalent petrol driving
// Average grid: ~0.233 kg CO₂/kWh; petrol car kWh-equivalent ~0.7 kg/kWh
// Saving ≈ (0.7 - 0.233) × kWh = ~0.467 kg/kWh
const KWH_SAVING = 0.467;
const KWH_CREDITS_PER_UNIT = 4;

function KwhModal({action, t, onConfirm, onClose}) {
  const [kwh, setKwh]           = useState(20);
  const [inputVal, setInputVal] = useState("20");
  const [editing, setEditing]   = useState(false);
  const inputRef = useRef();

  const KWH_MAX = 100;
  const KWH_PRESETS = [5,10,20,30,50,80];

  const fmtK = v => v%1===0?String(v):v.toFixed(1);
  const handleSlider = e=>{const v=parseFloat(e.target.value);setKwh(v);setInputVal(fmtK(v));};
  const handleBlur   = ()=>{const n=parseFloat(inputVal);const c=isNaN(n)||n<=0?10:Math.min(KWH_MAX,Math.max(0.1,n));setKwh(c);setInputVal(fmtK(c));setEditing(false);};
  const snap         = p=>{setKwh(p);setInputVal(String(p));};

  const co2     = parseFloat((KWH_SAVING*kwh).toFixed(2));
  const credits = Math.max(1,Math.round(KWH_CREDITS_PER_UNIT*kwh));
  const fillPct = Math.min((kwh/KWH_MAX)*100,100);

  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:t.overlay,zIndex:200,
        display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:t.card,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:420,
        paddingBottom:32,animation:"slideUp .28s ease",border:`1px solid ${t.cardBorder}`}}>
        <div style={{display:"flex",justifyContent:"center",padding:"14px 0 6px"}}>
          <div style={{width:40,height:4,background:t.cardBorder,borderRadius:99}}/>
        </div>
        <div style={{padding:"10px 24px 16px",borderBottom:`1px solid ${t.cardBorder}`,
          display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:28}}>⚡🔌</span>
            <div>
              <div style={{color:t.text,fontWeight:800,fontSize:17}}>EV Charged</div>
              <div style={{color:t.textSub,fontSize:12}}>Log kWh from your charging session</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:t.cardAlt,border:"none",color:t.textSub,
            borderRadius:99,width:32,height:32,cursor:"pointer",fontSize:15,
            display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>

        <div style={{padding:"16px 24px 0",display:"flex",flexDirection:"column",gap:16}}>
          {/* Charger data note */}
          <div style={{background:t.primarySoft,borderRadius:12,padding:"10px 14px",
            border:`1px solid ${t.primary}33`,display:"flex",gap:8,alignItems:"flex-start"}}>
            <span style={{color:t.primary,fontSize:14,marginTop:1}}>✦</span>
            <span style={{color:t.primary,fontSize:12,lineHeight:1.5}}>
              Find kWh on your charger app (Zap-Map, Chargepoint, Tesla, etc.) for a verified reading.
            </span>
          </div>

          {/* kWh input */}
          <div style={{textAlign:"center"}}>
            <div style={{color:t.textMuted,fontSize:11,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>
              Energy charged
            </div>
            <div style={{display:"flex",alignItems:"baseline",justifyContent:"center",gap:6,marginBottom:16}}>
              {editing?(
                <input ref={inputRef} value={inputVal}
                  onChange={e=>{setInputVal(e.target.value);const n=parseFloat(e.target.value);if(!isNaN(n)&&n>0)setKwh(Math.min(KWH_MAX,Math.max(0.1,n)));}}
                  onBlur={handleBlur} type="number" min="0.1" max="100" step="0.5"
                  style={{background:"none",border:"none",borderBottom:`2px solid ${t.primary}`,
                    color:t.primary,fontSize:52,fontWeight:800,width:110,textAlign:"center",

              ):(
                <div onClick={()=>{setEditing(true);setTimeout(()=>inputRef.current?.select(),40);}}

            {/* Slider */}
            <div style={{position:"relative",height:24,display:"flex",alignItems:"center",marginBottom:12}}>

              <div style={{position:"absolute",left:`calc(${fillPct}% - 11px)`,width:22,height:22,

              <input type="range" min={0.1} max={KWH_MAX} step={0.5} value={kwh}

                const active=Math.abs(kwh-p)<0.1;
                return(
                  <button key={p} onClick={()=>snap(p)}
                    style={{background:active?t.primary:t.cardAlt,color:active?"#fff":t.textSub,
                      border:`1px solid ${active?t.primary:t.cardBorder}`,borderRadius:99,
                      padding:"5px 11px",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>
                    {p} kWh
                  </button>
                );
              })}
            </div>
          </div>

          {/* Impact preview */}
          <div style={{background:t.cardAlt,borderRadius:16,padding:"14px 8px",
            display:"flex",justifyContent:"space-around",border:`1px solid ${t.cardBorder}`}}>
            {[
              {val:`+${credits}`, sub:"credits",   color:t.green},
              {val:`~${co2} kg`,  sub:"CO₂ saved", color:t.primary},
              {val:`${fmtK(kwh)} kWh`, sub:"charged", color:t.coral},
            ].map((s,i)=>(
              <div key={i} style={{textAlign:"center",flex:1}}>
                <div style={{color:s.color,fontWeight:800,fontSize:17}}>{s.val}</div>
                <div style={{color:t.textMuted,fontSize:11,marginTop:2}}>{s.sub}</div>
              </div>
            ))}
          </div>

          <div style={{color:t.textMuted,fontSize:11,textAlign:"center"}}>
            ~{co2} kg saved vs equivalent petrol · grid emissions vary by region
          </div>

          <button onClick={()=>onConfirm({co2,credits,kwh})}
            style={{...mkBtn(t,t.primary),margin:0,width:"100%",borderRadius:14,fontSize:15}}>
            Log {fmtK(kwh)} kWh charged ✓
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── ADVOCACY SCREEN (slides up as modal) ─────────────────────────────────────
function AdvocacyScreen({t, user, onLog, onClose}) {
  const [ngoModal, setNGO] = useState(false);
  const todayLogs  = user.todayLogs||[];
  const loggedIds  = todayLogs.map(l=>l.id);
  const totalCredits = ADVOCACY_ACTIONS.reduce((s,a)=>s+(loggedIds.includes(a.id)?a.credits:0),0);

  const handleTap = a => {
    if(loggedIds.includes(a.id)) return;
    if(a.hasNGO){ setNGO(true); return; }
    if(a.hasReferral){
      navigator.clipboard?.writeText(`Join me on ActSapien! Use code ${REFERRAL_CODE} to get started 🌿`).catch(()=>{});
      onLog(a,{co2:0,credits:a.credits},{verified:false,note:"referral"});
      return;
    }
    onLog(a,{co2:0,credits:a.credits},{verified:false});
  };
  const handleNGO = ngo => {
    setNGO(false);
    const a = ADVOCACY_ACTIONS.find(x=>x.id==="ngo");
    onLog(a,{co2:0,credits:a.credits},{verified:false,ngo:ngo.id,ngoName:ngo.name});
  };

  return(
    <>
      <div onClick={e=>e.target===e.currentTarget&&onClose()}
        style={{position:"fixed",inset:0,background:t.overlay,zIndex:200,
          display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:t.shell,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:420,
          paddingBottom:36,animation:"slideUp .3s ease",maxHeight:"88vh",overflowY:"auto",
          border:`1px solid ${t.cardBorder}`}}>

          {/* Handle */}

                <button key={a.id} onClick={()=>handleTap(a)}
                  style={{background:done?t.greenSoft:t.card,
                    border:`2px solid ${done?t.green+"66":t.cardBorder}`,
                    borderRadius:16,padding:"16px",cursor:done?"default":"pointer",
                    textAlign:"left",transition:"all .2s",display:"flex",gap:14,alignItems:"center"}}>
                  <div style={{fontSize:28,flexShrink:0}}>{a.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{color:t.text,fontWeight:700,fontSize:15}}>{a.label}</div>

                      {done

                  <div style={{flexShrink:0}}>
                    {done
                      ?<span style={{color:t.green,fontSize:18}}>✓</span>
                      :<span style={{background:t.greenSoft,color:t.green,borderRadius:99,
                        padding:"5px 12px",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}>
                        +{a.credits}
                      </span>

            })}

          <div style={{color:t.textMuted,fontSize:11,textAlign:"center",padding:"14px 20px 0"}}>
            Advocacy actions are self-reported · no CO₂ value assigned
          </div>
        </div>
      </div>
      {ngoModal&&<NGOModal t={t} onSelect={handleNGO} onClose={()=>setNGO(false)}/>}
    </>
  );
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function HomeScreen({user,setUser,t,connectedApps,onLog,onOpenFitness}) {
  const [modal,setModal]           = useState(null);
  const [kwhModal,setKwhModal]     = useState(false);
  const [showAdvocacy,setAdvocacy] = useState(false);
  const [showGoalPicker,setGoalPicker] = useState(false);
  const co2Goal    = user.co2Goal || 1.0; // kg CO₂ saved daily goal
  const todayLogs  = user.todayLogs||[];
  const loggedIds  = todayLogs.map(l=>l.id);
  const verCount   = todayLogs.filter(l=>l.verified).length;
  const todayCo2   = todayLogs.reduce((s,l)=>s+(l.co2||0),0);
  const pct        = Math.min(todayCo2/co2Goal,1);
  const advDone    = ADVOCACY_ACTIONS.filter(a=>loggedIds.includes(a.id)).length;
  const CO2_GOALS  = [0.5,1.0,1.5,2.0,3.0,5.0];

  const handleTap = a=>{
    if(loggedIds.includes(a.id)) return;
    if(a.hasDistance){setModal(a);return;}
    if(a.hasKwh){setKwhModal(true);return;}
    onLog(a,{co2:a.co2,credits:a.credits},{verified:false});
  };

  const renderGrid=(actions, equalHeight=false)=>(
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:4,
      gridAutoRows: equalHeight?"1fr":"auto"}}>
      {actions.map(a=>{
        const done=loggedIds.includes(a.id);
        const log=todayLogs.find(l=>l.id===a.id);
        const appDot=!done&&connectedApps.length>0&&MOCK_HEALTH[a.id];
        const borderCol=done?(log?.verified?t.primary+"66":t.green+"66"):t.cardBorder;
        const bgCol=done?(log?.verified?t.primarySoft:t.greenSoft):t.card;
        const subCol=done?(log?.verified?t.primary:t.green):t.textSub;
        return(
          <button key={a.id} onClick={()=>handleTap(a)}
            style={{background:bgCol,border:`2px solid ${borderCol}`,borderRadius:16,
              padding:"14px 12px",cursor:done?"default":"pointer",
              textAlign:"left",transition:"all .2s",position:"relative",
              display:"flex",flexDirection:"column",justifyContent:"flex-start"}}>
            <div style={{fontSize:22,marginBottom:6}}>{a.icon}</div>
            <div style={{color:t.text,fontWeight:700,fontSize:13}}>{a.label}</div>
            <div style={{color:subCol,fontSize:11,marginTop:3}}>
              {done
                ?(log?.km?`${log.km>=1?log.km.toFixed(1)+"km":Math.round(log.km*1000)+"m"} · +${log.credits}`
                  :log?.kwh?`${log.kwh} kWh · +${log.credits}`
                  :`+${log.credits} credits`)
                :(a.hasDistance?"Set distance →":a.hasKwh?"Log kWh →":`+${a.credits} credits`)}
            </div>
            {done&&<div style={{marginTop:6}}>
              {log?.verified?<VerifiedBadge t={t}/>:<ManualBadge t={t}/>}
            </div>}
            {appDot&&<div style={{position:"absolute",top:10,right:10,
              width:8,height:8,borderRadius:"50%",background:t.primary}}/>}
          </button>
        );
      })}
    </div>
  );

  return(
    <>
      <div style={{...mkScreen(),background:t.shell,overflowY:"auto",paddingBottom:88}}>
        {/* Header */}
        <div style={{padding:"20px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:t.textMuted,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>ActSapien</div>
            <div style={{color:t.text,fontWeight:800,fontSize:21,marginTop:2}}>Hey, {user.name} 👋</div>
          </div>
          <div style={{background:t.coralSoft,border:`1px solid ${t.coral}44`,
            borderRadius:99,padding:"6px 14px",fontSize:14,fontWeight:700,color:t.coral}}>
            🔥 {user.streak}
          </div>
        </div>

        {/* Fitness banner */}
        {connectedApps.length===0?(
          <div onClick={onOpenFitness} style={{margin:"12px 20px 0",background:t.primarySoft,
            border:`1px solid ${t.primary}44`,borderRadius:16,padding:"12px 16px",
            display:"flex",gap:12,alignItems:"center",cursor:"pointer"}}>
            <span style={{fontSize:22}}>🏃</span>
            <div style={{flex:1}}>
              <div style={{color:t.primary,fontWeight:700,fontSize:13}}>Connect your fitness app</div>
              <div style={{color:t.textSub,fontSize:11,marginTop:1}}>Strava · Apple Health · Garmin & more</div>
            </div>
            <span style={{color:t.primary,fontSize:20}}>›</span>
          </div>
        ):(
          <div style={{margin:"12px 20px 0",background:t.primarySoft,
            border:`1px solid ${t.primary}33`,borderRadius:16,padding:"10px 16px",
            display:"flex",gap:10,alignItems:"center"}}>
            <div style={{display:"flex",gap:4}}>
              {connectedApps.slice(0,3).map(id=>{
                const fa=FITNESS_APPS.find(a=>a.id===id);
                return fa?<div key={id} style={{width:24,height:24,borderRadius:6,background:fa.color,
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>{fa.icon}</div>:null;
              })}
            </div>
            <div style={{flex:1,color:t.primary,fontSize:12,fontWeight:600}}>
              {connectedApps.length} app{connectedApps.length>1?"s":""} connected
              {verCount>0?` · ${verCount} verified today`:""}
            </div>
            <VerifiedBadge t={t}/>
          </div>
        )}

        {/* Stats row */}
        <div style={{display:"flex",gap:10,padding:"12px 20px"}}>
          {[
            {label:"Green Credits", value:user.credits||0,                        icon:"🌿",color:t.green},
            {label:"Carbon Score",  value:`~${(user.co2||0).toFixed(1)} kg`,      icon:"🌊",color:t.primary},
            {label:"Streak",        value:`${user.streak||0} days`,               icon:"🔥",color:t.coral},
          ].map(s=>(
            <div key={s.label} style={{flex:1,background:t.card,borderRadius:16,
              padding:"12px 10px",border:`1px solid ${t.cardBorder}`}}>
              <div style={{fontSize:18}}>{s.icon}</div>
              <div style={{color:s.color,fontWeight:800,fontSize:17,margin:"4px 0 2px"}}>{s.value}</div>
              <div style={{color:t.textSub,fontSize:10}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* Progress bar — CO₂ goal */}
        <div style={{margin:"0 20px 16px",background:t.card,borderRadius:16,
          padding:14,border:`1px solid ${t.cardBorder}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{color:t.text,fontWeight:600,fontSize:14}}>Today's CO₂ saved</div>
            <button onClick={()=>setGoalPicker(true)}
              style={{background:"none",border:`1px solid ${t.cardBorder}`,borderRadius:99,
                padding:"3px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
              <span style={{color:t.green,fontSize:12,fontWeight:700}}>
                ~{todayCo2.toFixed(2)} / {co2Goal} kg
              </span>
              <span style={{color:t.textMuted,fontSize:11}}>⚙️</span>
            </button>
          </div>
          <div style={{height:10,background:t.cardAlt,borderRadius:99,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct*100}%`,
              background:`linear-gradient(90deg,${t.green},${t.primary})`,
              borderRadius:99,transition:"width .6s"}}/>
          </div>
          {pct>=1&&<div style={{color:t.green,fontSize:12,marginTop:8,textAlign:"center",fontWeight:600}}>
            🎉 Daily CO₂ goal smashed!

        {/* CO₂ Goal Picker */}
        {showGoalPicker&&(
          <div onClick={e=>e.target===e.currentTarget&&setGoalPicker(false)}

              <div style={{padding:"10px 24px 20px"}}>
                <div style={{color:t.text,fontWeight:800,fontSize:18,marginBottom:4}}>Daily CO₂ Goal</div>
                <div style={{color:t.textSub,fontSize:13,marginBottom:20}}>
                  How much CO₂ do you aim to save each day?
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                  {CO2_GOALS.map(g=>{
                    const active=co2Goal===g;
                    return(
                      <button key={g} onClick={()=>{setUser({...user,co2Goal:g});setGoalPicker(false);}}
                        style={{background:active?t.green:t.cardAlt,
                          color:active?"#fff":t.textSub,
                          border:`2px solid ${active?t.green:t.cardBorder}`,
                          borderRadius:14,padding:"14px 8px",cursor:"pointer",
                          display:"flex",flexDirection:"column",alignItems:"center",gap:4,
                          transition:"all .2s"}}>
                        <span style={{fontWeight:800,fontSize:18}}>{g}</span>
                        <span style={{fontSize:11}}>kg CO₂</span>
                      </button>
                    );
                  })}

                  ⚠️ Based on estimated values · not precisely measured
                </div>

            </div>
          </div>

        {/* Action sections */}
        <div style={{padding:"0 20px"}}>

          {/* Getting Around */}
          <SectionHeader t={t} label="Getting Around" icon="🚗"/>
          {renderGrid(ACTIONS.filter(a=>a.group==="travel"))}
          <div style={{height:14}}/>

          {/* Lifestyle + Advocacy as unified 2×2 equal grid */}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,
            gridAutoRows:"1fr",marginBottom:4}}>
            {ACTIONS.filter(a=>a.group==="life").map(a=>{
              const done=loggedIds.includes(a.id);
              const log=todayLogs.find(l=>l.id===a.id);
              const borderCol=done?(log?.verified?t.primary+"66":t.green+"66"):t.cardBorder;
              const bgCol=done?(log?.verified?t.primarySoft:t.greenSoft):t.card;

              return(

                border:`2px solid ${advDone>0?t.green+"66":t.cardBorder}`,
                borderRadius:16,padding:"14px 12px",cursor:"pointer",
                textAlign:"left",transition:"all .2s",
                display:"flex",flexDirection:"column",justifyContent:"flex-start"}}>
              <div style={{fontSize:22,marginBottom:6}}>📣</div>
              <div style={{color:t.text,fontWeight:700,fontSize:13}}>Advocacy</div>
              <div style={{color:advDone>0?t.green:t.textSub,fontSize:11,marginTop:3}}>
                {advDone>0?`${advDone}/${ADVOCACY_ACTIONS.length} done`:"for a cause →"}

              {advDone>0&&(
                <div style={{display:"flex",gap:4,marginTop:6}}>
                  {ADVOCACY_ACTIONS.map(a=>(

        }}

      {showAdvocacy&&<AdvocacyScreen t={t} user={user} onLog={onLog} onClose={()=>setAdvocacy(false)}/>}
    </>
  );
}

                  </div>
                </div>
                <div style={{background:t.greenSoft,color:t.green,borderRadius:99,

                </div>
              </div>

// ─── IMPACT ───────────────────────────────────────────────────────────────────
function ImpactScreen({user,t}) {
  const [period,setPeriod]=useState("Lifetime");
  const base={co2:user.allTimeCo2||0,totalKm:user.totalKm||0,
    verified:user.verifiedCo2||0,credits:user.credits||0};

  // Simulate period fractions for demo purposes
  const scaleFactor={Weekly:.05,Monthly:.2,Yearly:.9,Lifetime:1}[period]||1;
  const co2      = parseFloat((base.co2*scaleFactor).toFixed(2));
  const totalKm  = parseFloat((base.totalKm*scaleFactor).toFixed(1));
  const verified = parseFloat((base.verified*scaleFactor).toFixed(2));
  const manual   = Math.max(0,parseFloat((co2-verified).toFixed(2)));
  const verPct   = co2>0?Math.round((verified/co2)*100):0;
  const credits  = Math.round(base.credits*scaleFactor);

  return(
    <div style={{...mkScreen(),background:t.shell,overflowY:"auto",paddingBottom:88}}>
      <div style={{padding:"22px 20px 12px"}}>
        <div style={{color:t.textMuted,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>ActSapien</div>
        <div style={{color:t.text,fontWeight:800,fontSize:22,marginTop:4}}>Your Impact</div>
        <div style={{color:t.textSub,fontSize:13,marginTop:4}}>~estimates · not third-party verified</div>
      </div>

      {/* Period tabs */}
      <div style={{display:"flex",gap:6,padding:"0 20px 16px"}}>
        {PERIODS.map(p=>(
          <button key={p} onClick={()=>setPeriod(p)}
            style={{flex:1,background:period===p?t.green:t.card,
              color:period===p?"#fff":t.textSub,
              border:`1px solid ${period===p?t.green:t.cardBorder}`,
              borderRadius:99,padding:"7px 4px",fontSize:11,fontWeight:700,
              cursor:"pointer",transition:"all .2s"}}>
            {p}
          </button>
        ))}
      </div>

      {/* CO₂ hero */}
      <div style={{margin:"0 20px 14px",
        background:`linear-gradient(135deg,${t.greenSoft},${t.primarySoft})`,
        border:`2px solid ${t.green}44`,borderRadius:20,padding:"24px 28px",textAlign:"center"}}>
        <div style={{color:t.green,fontSize:52,fontWeight:800,lineHeight:1}}>{co2.toFixed(2)}</div>
        <div style={{color:t.textSub,fontSize:14,marginTop:4}}>kg CO₂ saved · {period.toLowerCase()}</div>
        <div style={{color:t.textMuted,fontSize:11,marginTop:6}}>⚠️ Estimated, not third-party verified</div>
      </div>

      {/* Credibility bar */}
      {co2>0&&(
        <div style={{margin:"0 20px 12px",background:t.card,borderRadius:16,
          padding:16,border:`1px solid ${t.cardBorder}`}}>
          <div style={{color:t.textMuted,fontSize:11,marginBottom:10,
            textTransform:"uppercase",letterSpacing:1,fontWeight:700}}>Data credibility</div>
          <div style={{height:10,background:t.cardAlt,borderRadius:99,overflow:"hidden",marginBottom:8,display:"flex"}}>
            <div style={{width:`${verPct}%`,background:`linear-gradient(90deg,${t.primary},${t.green})`,transition:"width .8s"}}/>
            <div style={{flex:1,background:t.cardBorder}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:t.primary}}/>
              <span style={{color:t.primary,fontSize:11}}>{verified.toFixed(2)} kg verified ({verPct}%)</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:t.cardBorder}}/>
              <span style={{color:t.textSub,fontSize:11}}>{manual.toFixed(2)} kg manual</span>
            </div>
          </div>
        </div>
      )}

      {/* km + credits row */}
      <div style={{display:"flex",gap:10,padding:"0 20px 12px"}}>
        <div style={{flex:1,background:t.card,borderRadius:16,padding:"14px",
          border:`1px solid ${t.cardBorder}`,textAlign:"center"}}>
          <div style={{color:t.primary,fontSize:30,fontWeight:800}}>{totalKm.toFixed(1)}</div>
          <div style={{color:t.textSub,fontSize:12,marginTop:2}}>km logged</div>
        </div>
        <div style={{flex:1,background:t.card,borderRadius:16,padding:"14px",
          border:`1px solid ${t.cardBorder}`,textAlign:"center"}}>
          <div style={{color:t.green,fontSize:30,fontWeight:800}}>{credits}</div>
          <div style={{color:t.textSub,fontSize:12,marginTop:2}}>🌿 green credits</div>
        </div>
      </div>

      {/* Equivalents */}
      <div style={{padding:"0 20px 20px"}}>
        <div style={{color:t.textMuted,fontSize:11,marginBottom:10,
          textTransform:"uppercase",letterSpacing:1,fontWeight:700}}>That's like…</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {EQUIV.map(e=>(
            <div key={e.label} style={{background:t.card,borderRadius:14,padding:"13px 16px",
              display:"flex",alignItems:"center",gap:14,border:`1px solid ${t.cardBorder}`}}>
              <div style={{fontSize:26}}>{e.icon}</div>
              <div>
                <div style={{color:t.text,fontWeight:700,fontSize:17}}>{(co2/e.per).toFixed(1)}</div>
                <div style={{color:t.textSub,fontSize:12}}>{e.label}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── LEADERBOARD ──────────────────────────────────────────────────────────────
function LeaderboardScreen({user,t}) {
  const myVer=user.allTimeCo2>0?Math.round(((user.verifiedCo2||0)/user.allTimeCo2)*100):0;
  const board=[...LEADERBOARD];
  const me={name:"You",credits:user.credits||0,streak:user.streak||0,avatar:"😊",isMe:true,verifiedPct:myVer};
  const idx=board.findIndex(u=>u.credits<=user.credits);
  if(idx>=0)board.splice(idx,0,me);else board.push(me);
  return(
    <div style={{...mkScreen(),background:t.shell,overflowY:"auto",paddingBottom:88}}>
      <div style={{padding:"22px 20px 0"}}>
        <div style={{color:t.textMuted,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>ActSapien</div>
        <div style={{color:t.text,fontWeight:800,fontSize:22,marginTop:4}}>Leaderboard</div>
        <div style={{color:t.textSub,fontSize:13,marginTop:4}}>This week's eco heroes</div>
      </div>
      <div style={{margin:"12px 20px 4px",display:"flex",gap:8,alignItems:"center"}}>
        <VerifiedBadge t={t}/><span style={{color:t.textMuted,fontSize:11}}>= 70%+ app-verified logs</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8,padding:20}}>
        {board.slice(0,6).map((u,i)=>(
          <div key={i} style={{background:u.isMe?t.greenSoft:t.card,
            border:`2px solid ${u.isMe?t.green+"66":i===0?t.coral+"55":t.cardBorder}`,
            borderRadius:14,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:26,textAlign:"center",fontWeight:800,fontSize:15,
              color:i===0?t.coral:i===1?t.textSub:i===2?t.coral+"99":t.textMuted}}>
              {i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`}
            </div>
            <div style={{fontSize:26}}>{u.avatar}</div>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <span style={{color:t.text,fontWeight:700,fontSize:14}}>{u.name}{u.isMe&&" (you)"}</span>
                {u.verifiedPct>=70&&<VerifiedBadge t={t}/>}
              </div>
              <div style={{display:"flex",gap:8,marginTop:3}}>
                <span style={{color:t.textSub,fontSize:11}}>🔥 {u.streak} streak</span>
                <span style={{color:t.textMuted,fontSize:10}}>· {u.verifiedPct}% verified</span>
              </div>
            </div>
            <div style={{color:t.green,fontWeight:800,fontSize:15}}>{u.credits} 🌿</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
const TABS=[
  {id:"home",       icon:"🏠",label:"Home"},
  {id:"challenges", icon:"⚡",label:"Challenges"},
  {id:"impact",     icon:"🌊",label:"Impact"},
  {id:"leaders",    icon:"🏆",label:"Leaderboard"},
];

function App() {
  const dark=useDark();
  const t=dark?DARK:LIGHT;
  const [user,setUser]               = useStorage("act_user",null);
  const [connectedApps,setConnected] = useStorage("act_apps",[]);
  const [tab,setTab]                 = useState("home");
  const [toast,setToast]             = useState(null);
  const [confetti,setConfetti]       = useState(false);
  const [showFitness,setShowFitness] = useState(false);

  useEffect(()=>{
    if(!user) return;
    if(user.lastDay!==today()){
      const wasYest=user.lastDay===new Date(Date.now()-86400000).toDateString();
      setUser({...user,todayLogs:[],lastDay:today(),
        streak:wasYest?(user.streak||0)+1:(user.lastDay?0:user.streak||0)});
    }
  },[]);

  const handleLogin=name=>setUser({
    name,credits:0,co2:0,allTimeCo2:0,verifiedCo2:0,totalKm:0,
    streak:0,todayLogs:[],lastDay:today(),co2Goal:1.0,
  });

  const handleConnect    =id=>setConnected(p=>[...p.filter(x=>x!==id),id]);
  const handleDisconnect =id=>setConnected(p=>p.filter(x=>x!==id));

  const handleLog=(action,calc,meta)=>{
    const {co2,credits}=calc;
    const km=meta?.km||0;
    const kwh=meta?.kwh||0;
    const verified=meta?.verified||false;
    const log={id:action.id,ts:Date.now(),co2,credits,km,kwh,
      subtype:meta?.subtype||null,passengers:meta?.passengers||null,
      verified,ngo:meta?.ngo||null,ngoName:meta?.ngoName||null};
    setUser({
      ...user,
      todayLogs:[...(user.todayLogs||[]),log],
      credits:    user.credits+credits,
      co2:        (user.co2||0)+co2,
      allTimeCo2: (user.allTimeCo2||0)+co2,
      verifiedCo2:(user.verifiedCo2||0)+(verified?co2:0),
      totalKm:    (user.totalKm||0)+km,
    });
    const distStr=km>0?` · ${km>=1?km.toFixed(1)+"km":Math.round(km*1000)+"m"}`:""
    const ngoStr=meta?.ngoName?` → ${meta.ngoName}`:"";
    setToast(`+${credits} credits${distStr}${ngoStr}${verified?" ✦":""}`);
    setConfetti(true);setTimeout(()=>setConfetti(false),1400);
  };

  if(!user) return(
    <><style>{CSS}</style>
      <div style={mkShell(t)}><LoginScreen t={t} onLogin={handleLogin}/></div>
    </>
  );

  return(
    <><style>{CSS}</style>
      <div style={mkShell(t)}>
        <div style={{flex:1,overflow:"hidden",position:"relative"}}>
          {tab==="home"       &&<HomeScreen user={user} setUser={setUser} t={t} connectedApps={connectedApps}
            onLog={handleLog} onOpenFitness={()=>setShowFitness(true)}/>}
          {tab==="challenges" &&<ChallengesScreen t={t}/>}
          {tab==="impact"     &&<ImpactScreen user={user} t={t}/>}
          {tab==="leaders"    &&<LeaderboardScreen user={user} t={t}/>}
        </div>
        <div style={{display:"flex",borderTop:`1px solid ${t.navBorder}`,background:t.nav}}>
          {TABS.map(tb=>(
            <button key={tb.id} onClick={()=>setTab(tb.id)}
              style={{flex:1,background:"none",border:"none",padding:"10px 0",cursor:"pointer",
                display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{fontSize:20,opacity:tab===tb.id?1:0.35,
                transform:tab===tb.id?"scale(1.18)":"scale(1)",transition:"all .2s"}}>{tb.icon}</div>
              <div style={{fontSize:10,fontWeight:tab===tb.id?700:500,
                color:tab===tb.id?t.green:t.textMuted}}>{tb.label}</div>
            </button>
          ))}
        </div>
        {toast      &&<Toast msg={toast} t={t} onDone={()=>setToast(null)}/>}
        {confetti   &&<Confetti/>}
        {showFitness&&<FitnessConnectModal t={t} connectedApps={connectedApps}
          onConnect={handleConnect} onDisconnect={handleDisconnect}
          onClose={()=>setShowFitness(false)}/>}
      </div>
    </>
  );
}

const CSS=`
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
  @keyframes bounce      {from{transform:translateY(0)}to{transform:translateY(-12px)}}
  @keyframes spin        {from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes toastIn     {from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  @keyframes slideUp     {from{transform:translateY(100%)}to{transform:translateY(0)}}
`;


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
